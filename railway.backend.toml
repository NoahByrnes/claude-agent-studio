[build]
builder = "NIXPACKS"

[build.nixpacksPlan]
providers = ["node"]

[[build.nixpacksPlan.phases.setup]]
cmds = ["npm install"]

[[build.nixpacksPlan.phases.build]]
cmds = ["npm run build:types", "npm run build:backend"]

[deploy]
startCommand = "npm run start:backend"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
